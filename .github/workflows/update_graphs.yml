name: Generate IDOS Charts

on:
  schedule:
    - cron: '0 */6 * * *' # Spustí sa každých 6 hodín
  push:
    branches:
      - main
  workflow_dispatch: # Umožní spustiť skript ručne stlačením tlačidla na GitHube

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Povolenie pre zápis vygenerovaného index.html späť do repozitára

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas plotly

    - name: Run chart generator
      run: python generate_charts.py

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.name "github-actions[bot]@://github.com"
        git add indexx.html
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automatická aktualizácia grafov [skip ci]" && git push)
